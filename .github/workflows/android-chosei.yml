name: Build Android Chosei APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Pin .NET 9 SDK & Install Android workload
        run: |
          dotnet new globaljson --sdk-version $(dotnet --list-sdks | grep "^9\." | tail -n 1 | awk '{print $1}') --force
          sudo XDG_RUNTIME_DIR=/tmp dotnet workload update
          sudo XDG_RUNTIME_DIR=/tmp dotnet workload install maui-android

      - name: Restore dependencies (arm64 only)
        run: |
          dotnet restore OpenUtauMobile/OpenUtauMobile.csproj \
            -p:TargetFramework=net9.0-android \
            -p:TargetFrameworks=net9.0-android \
            -p:RuntimeIdentifiers=android-arm64 \
            -p:CheckEolWorkloads=false

      -      - name: Build Android APK (arm64)
        run: |
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            --no-restore \
            -f net9.0-android \
            -p:TargetFramework=net9.0-android \
            -p:TargetFrameworks=net9.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:RuntimeIdentifiers=android-arm64 \
            -p:RuntimeIdentifier=android-arm64 \
            -p:AndroidCreatePackagePerAbi=false \
            -p:RunAOTCompilation=false \
            -p:PublishTrimmed=false \
            -p:AndroidLinkTool="" \
            -p:EnableTrimAnalyzer=false \
            -p:CheckEolWorkloads=false \
            -p:AcceptAndroidSDKLicenses=True

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-Chosei-arm64
          path: OpenUtauMobile/bin/Release/net9.0-android/**/*-Signed.apk
