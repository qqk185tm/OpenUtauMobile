name: Build Android Chosei APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore OpenUtauMobile/OpenUtauMobile.csproj -p:TargetFramework=net9.0-android

      - name: Build Android APK (arm64)
        run: |
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            -f net9.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:RuntimeIdentifier=android-arm64 \
            -p:TargetFrameworks=net9.0-android \
            -p:AndroidCreatePackagePerAbi=false \
            -p:RunAOTCompilation=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-Chosei-arm64
          path: OpenUtauMobile/bin/Release/net9.0-android/**/*-Signed.apk
